name: Deploy directory
on:
  push:
    branches: [main]
  schedule:
    - cron: "17 5 * * *"   # daily: pick up new Pages sites automatically
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/build.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: |
          mkdir _site
          cp index.html app.js styles.css favicon.svg projects.json _site/
          printf 'User-agent: *\nAllow: /\nSitemap: https://248tech.github.io/sitemap.xml\n' > _site/robots.txt
          printf '<?xml version="1.0" encoding="UTF-8"?>\n<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9"><url><loc>https://248tech.github.io/</loc></url></urlset>\n' > _site/sitemap.xml
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
